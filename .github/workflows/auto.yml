name: Auto clip

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core unzip
      - name: Get TwitchDownloaderCLI
        run: |
          URL=$(curl -s https://api.github.com/repos/lay295/TwitchDownloader/releases/latest | grep browser_download_url | grep -i "CLI" | grep -i "linux-x64" | head -1 | cut -d '"' -f 4)
          echo "Downloading: $URL"
          curl -L "$URL" -o tdl.zip
          unzip -o tdl.zip -d tdl
          chmod +x tdl/TwitchDownloaderCLI
      - run: pip install -r requirements.txt faster-whisper
      - run: python edit/auto.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: auto-clips
          path: all/
          if-no-files-found: ignore
