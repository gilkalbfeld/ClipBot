name: Find clips

on:
  schedule:
    # ClipBot hunts for bangers by itself 3x a day (~7 AM, 1 PM, 7 PM New York)
    - cron: "41 12,18,0 * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "Dashboard job id"
        default: ""
      query:
        description: "What clips to find (or paste links)"
        required: true
      count:
        description: "How many"
        default: "5"

permissions:
  contents: write

concurrency:
  group: find-clips

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: pip install -r requirements.txt faster-whisper
      - name: Learn from feedback
        run: python tools/learn.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python tools/find.py
        env:
          QUERY: ${{ inputs.query || 'the funniest, most chaotic GTA 6 moments where the streamer completely loses it' }}
          COUNT: ${{ inputs.count || '5' }}
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Send clips to the dashboard
        run: |
          gh release view clips >/dev/null 2>&1 || gh release create clips --title "Clips" --notes "Scheduled clips"
          ls output/*_vertical.mp4 >/dev/null 2>&1 || exit 0
          gh release upload clips output/*_vertical.mp4 output/*_thumb.jpg output/*_post.txt output/*.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save list of made clips
        if: always()
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add made_clips.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update made clips list"
          git checkout -- . 2>/dev/null || true
          git pull --rebase origin main
          git push
      - name: Report result to the dashboard
        if: always()
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          for i in 1 2 3; do
            git pull -q --rebase origin main || true
            JOB_STATUS="${{ job.status }}" python tools/job_status.py
            git add jobs.json 2>/dev/null || exit 0
            git diff --cached --quiet && exit 0
            git commit -qm "Job ${{ inputs.job_id }} finished" && git push -q && exit 0
            git reset -q --hard origin/main
          done
        env:
          JOB_ID: ${{ inputs.job_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
