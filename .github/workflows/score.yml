name: AI score clips

on:
  workflow_dispatch:
    inputs:
      redo:
        description: "Rewrite titles for clips that already have one (1 = yes)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: ai-score

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install requests faster-whisper
      - run: python tools/score_existing.py
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDO: ${{ inputs.redo || '0' }}
