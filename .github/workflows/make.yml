name: Make vertical clips

on:
  workflow_dispatch:
  schedule:
    # 7:30 AM, 12:00 PM, 5:00 PM New York time (standard time; times are UTC)
    # When clocks spring forward in March, change 12/17/22 to 11/16/21
    - cron: "30 12 * * *"
    - cron: "0 17,22 * * *"

concurrency:
  group: make-clips

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt faster-whisper
      - run: python edit/make_vertical.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: vertical-clips
          path: output/
      - name: Save list of made clips
        if: always()
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add made_clips.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update made clips list"
          git pull --rebase origin main
          git push
