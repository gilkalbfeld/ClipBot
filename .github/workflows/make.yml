name: Make vertical clips

on:
  workflow_dispatch:
  schedule:
    # 7:30 AM, 12:00 PM, 5:00 PM New York time (standard time; times are UTC)
    # When clocks spring forward in March, change 12/17/22 to 11/16/21
    - cron: "30 12 * * *"
    - cron: "0 17,22 * * *"

concurrency:
  group: make-clips

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt faster-whisper
      - name: Learn from feedback
        run: python tools/learn.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python edit/make_vertical.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: vertical-clips
          path: output/
      - name: Send clips to the dashboard
        run: |
          gh release view clips >/dev/null 2>&1 || gh release create clips --title "Clips" --notes "Scheduled clips"
          ls output/*_vertical.mp4 >/dev/null 2>&1 || exit 0
          for f in output/*_vertical.mp4; do
            ffmpeg -loglevel error -y -ss 2 -i "$f" -frames:v 1 -vf "crop=iw:iw*3/4:0:(ih-iw*3/4)/2,scale=640:-2" -q:v 4 "${f%_vertical.mp4}_thumb.jpg"
          done
          gh release upload clips output/*_vertical.mp4 output/*_thumb.jpg output/*_post.txt output/*.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save list of made clips
        if: always()
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add made_clips.json learned.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update made clips list"
          git checkout -- . 2>/dev/null || true
          git pull --rebase origin main
          git push
