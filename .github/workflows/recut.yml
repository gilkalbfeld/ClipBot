name: Re-cut clip

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Dashboard job id"
        default: ""
      clip_id:
        description: "Clip id"
        required: true
      start_shift:
        description: "Seconds to move the start (negative = earlier)"
        default: "0"
      end_shift:
        description: "Seconds to move the end (positive = longer)"
        default: "0"

permissions:
  contents: write

jobs:
  recut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt faster-whisper
      - run: python tools/recut.py
        env:
          CLIP_ID: ${{ inputs.clip_id }}
          START_SHIFT: ${{ inputs.start_shift }}
          END_SHIFT: ${{ inputs.end_shift }}
          GH_TOKEN: ${{ github.token }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Report result to the dashboard
        if: always()
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          for i in 1 2 3; do
            git pull -q --rebase origin main || true
            JOB_STATUS="${{ job.status }}" python tools/job_status.py
            git add jobs.json 2>/dev/null || exit 0
            git diff --cached --quiet && exit 0
            git commit -qm "Job ${{ inputs.job_id }} finished" && git push -q && exit 0
            git reset -q --hard origin/main
          done
        env:
          JOB_ID: ${{ inputs.job_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
